[package]
name = "taunicorn"
version = "0.1.1"
edition = "2024"

description = "Cross-platform IPC transport infrastructure for Taunicorn"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/taurino-foundation/taunicorn"

keywords = ["ipc", "unix-socket", "named-pipe", "transport"]

categories = ["network-programming", "os"]

[features]
# Route every shared-core transport entry point through private admission.
compliance-profile = []

[dependencies]
tokio.workspace = true
serde.workspace = true
rmp.workspace = true
rmp-serde.workspace = true
anyhow.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
interprocess = { version = "2.2.3", default-features = false, features = ["tokio"] }
chacha20poly1305 = "0.11"
ed25519-dalek = "3.0"
getrandom = "0.4"
hkdf = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3.0", features = ["getrandom"] }
dotenvy = "0.15.7"


[target.'cfg(unix)'.dependencies]
libc = "0.2.178"

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1"


[[example]]
name = "ndjson"
path = "../../examples/rust/ndjson.rs"
