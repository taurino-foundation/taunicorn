[package]
name = "taunicorn"
version = "0.1.1"
edition = "2024"

description = "Cross-platform IPC transport infrastructure for Taunicorn"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/taurino-foundation/taunicorn"

keywords = [
    "ipc",
    "unix-socket",
    "named-pipe",
    "transport",
]

categories = [
    "network-programming",
    "os",
]

[dependencies]
anyhow = "1.0.91"
interprocess = {version = "2.2.3",default-features = false,features = ["tokio"]}
tokio = {version = "1.48.0",default-features = false,features = ["io-util","sync","time","macros"]}
tokio-util = {version = "0.7.17",default-features = false}
futures-util = "0.3.34"
chacha20poly1305 = "0.10"
ed25519-dalek = "3.0"
getrandom = "0.4"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "3.0", features = ["getrandom"] }
dotenvy = "0.15.7"


[target.'cfg(unix)'.dependencies]
libc = "0.2.178"

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
