[package]
name = "taunicorn-python"
version = "0.1.10"
edition = "2024"
publish = false

[lib]
name = "_taunicorn"
crate-type = ["cdylib"]

[dependencies]
taunicorn = { path = "../taunicorn" }
pyo3 = { version = "=0.29", default-features = false, features = [
  "abi3-py39",
  "anyhow",
  "bytes",
  "extension-module",
  "generate-import-lib",
  "macros",
] }
pyo3-async-runtimes = { version = "0.29", default-features = false, features = ["tokio-runtime"] }
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
