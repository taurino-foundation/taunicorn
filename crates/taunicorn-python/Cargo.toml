[package]
name = "taunicorn-python"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
name = "_taunicorn"
crate-type = ["cdylib"]

[dependencies]
pyo3 = {version = "=0.29", default-features = false, features = ["macros"]}
pyo3-async-runtimes = {version = "0.29", default-features = false, features = ["tokio-runtime"]}
anyhow = "1.0.91"
taunicorn-transport = {path = "../taunicorn-transport"}