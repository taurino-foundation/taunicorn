name: Publish

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"
  MATURIN_VERSION: "v1.11.5"

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Verify release tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --isolated --no-project --python 3.14 python - <<'PY'
          import os
          import pathlib
          import tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          version = cargo["package"]["version"]
          tag = os.environ["RELEASE_TAG"]

          if tag not in {version, f"v{version}"}:
              raise SystemExit(
                  f"release tag {tag!r} does not match Cargo package version {version!r}"
              )

          print(f"release tag {tag!r} matches Cargo version {version!r}")
          PY

      - name: Build source distribution
        shell: bash
        run: |
          printf 'maturin==%s\n' "${MATURIN_VERSION#v}" > /tmp/build-constraints.txt
          uv build --sdist --build-constraint /tmp/build-constraints.txt

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  wheels-linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            smoke_test: true

          - name: aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            smoke_test: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist
            -i python3.10 python3.11 python3.12 python3.13 python3.14

      - name: Smoke test CPython 3.14 wheel
        if: matrix.smoke_test
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*cp314*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"
          fi

          if [ -z "$wheel" ]; then
            echo "No CPython 3.14 or abi3 wheel found in dist/" >&2
            exit 1
          fi

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            python -c "from taunicorn import SocketListener, SocketStream; print(SocketListener, SocketStream)"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  wheels-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64

          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64

          - name: macOS aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python interpreters
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: ${{ matrix.target }}
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist
            -i python3.10 python3.11 python3.12 python3.13 python3.14

      - name: Smoke test CPython 3.14 wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*cp314*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"
          fi

          if [ -z "$wheel" ]; then
            echo "No CPython 3.14 or abi3 wheel found in dist/" >&2
            exit 1
          fi

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            python -c "from taunicorn import SocketListener, SocketStream; print(SocketListener, SocketStream)"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs:
      - sdist
      - wheels-linux
      - wheels-native
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    timeout-minutes: 5

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lah dist

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: dist/*

      - name: Publish
        run: uv publish --trusted-publishing always