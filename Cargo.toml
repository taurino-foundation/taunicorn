[workspace]
resolver = "3"

members = ["crates/taunicorn", "crates/taunicorn-python", "crates/taunicorn-javascript"]


[workspace.dependencies]
tokio = { version = "1.48.0", default-features = false, features = [
  "rt-multi-thread",
  "io-util",
  "sync",
  "time",
  "macros",
] }
tokio-util = { version = "0.7.17", default-features = false }
futures-util = "0.3.34"
anyhow = "1.0.91"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
rmp = "0.8.15"
rmp-serde = "1.3.1"


[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"


