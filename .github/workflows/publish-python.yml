# SPDX-License-Identifier: MIT OR Apache-2.0
name: Publish Python

on:
  pull_request:
    paths:
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.*'
      - 'python/**'
      - 'examples/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/ci/py_*.py'
      - 'scripts/ci/*sbom*.py'
      - 'scripts/ci/artifacts.py'
      - '.github/workflows/*python*.yml'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Publish Python push run for this main commit
        required: true
        type: string
      release_tag:
        description: Existing version tag on this main commit (e.g. v0.1.11)
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.1'
  MATURIN_VERSION: '1.14.1'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  validate:
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          def manifest(path):
              return tomllib.loads(Path(path).read_text())
          crate = manifest('crates/taunicorn-python/Cargo.toml')
          version = crate['package']['version']
          if version == {'workspace': True}:
              version = manifest('Cargo.toml')['workspace']['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), version
          assert manifest('pyproject.toml')['project']['requires-python'] == '>=3.9'
          assert 'abi3-py39' in crate['dependencies']['pyo3']['features']
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              assert os.environ['GITHUB_REF'] == 'refs/heads/main'
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag/version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY

  build-linux:
    name: build (linux-x86_64, ubuntu-24.04, x86_64-unknown-linux-gnu, 2_17)
    if: github.event_name != 'workflow_dispatch'
    needs: validate
    strategy: &linux-target
      matrix:
        include:
          - { id: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2_17' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: &build-steps
      - *checkout
      - if: matrix.id != 'sdist'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --manifest-path crates/taunicorn-python/Cargo.toml --out dist
      - &uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.18'
          enable-cache: false
      - if: matrix.id == 'sdist'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          RUSTUP_TOOLCHAIN="$RUST_VERSION" uvx --from "maturin==$MATURIN_VERSION" maturin sdist --manifest-path crates/taunicorn-python/Cargo.toml --out dist
      - run: python scripts/ci/artifacts.py seal dist
      - name: Inventory the sealed distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -n "$TARGET" ]]; then
            uv run --no-project --python 3.12 python scripts/ci/release_sbom.py sboms dist/*.whl --target "$TARGET"
          else
            uv run --no-project --python 3.12 python scripts/ci/release_sbom.py sboms dist/*.tar.gz
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python-${{ matrix.id }}-${{ github.run_attempt }}
          path: sboms/*.cdx.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: py-${{ needs.validate.outputs.version }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build (windows-x86_64, windows-2025, x86_64-pc-windows-msvc, off)
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, build-linux]
    strategy: &windows-target
      matrix:
        include:
          - { id: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, manylinux: 'off' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *build-steps

  build-macos-intel:
    name: build (macos-x86_64, macos-15-intel, x86_64-apple-darwin, off)
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, build-windows]
    strategy: &macos-intel-target
      matrix:
        include:
          - { id: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, manylinux: 'off' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *build-steps

  build-macos-arm64:
    name: build (macos-arm64, macos-15, aarch64-apple-darwin, off)
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, build-macos-intel]
    strategy: &macos-arm64-target
      matrix:
        include:
          - { id: macos-arm64, os: macos-15, target: aarch64-apple-darwin, manylinux: 'off' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *build-steps

  build-sdist:
    name: build (sdist, ubuntu-24.04)
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, build-macos-arm64]
    strategy: &sdist-target
      matrix:
        include:
          - { id: sdist, os: ubuntu-24.04, target: '', manylinux: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *build-steps

  pr-test-linux:
    name: pr-test (linux-x86_64, ubuntu-24.04, x86_64-unknown-linux-gnu, 2_17)
    if: github.event_name == 'pull_request'
    needs: [validate, build-sdist]
    strategy: *linux-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: &install-tests
      - *checkout
      - *uv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: py-${{ needs.validate.outputs.version }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: dist
      - run: python scripts/ci/artifacts.py verify dist
      - name: Install and test downloaded distribution
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PY_ROLLBACK_DRILL: ${{ matrix.id == 'linux-x86_64' && '1' || '0' }}
        run: |
          if [[ '${{ matrix.id }}' == sdist ]]; then
            rustup toolchain install "$RUST_VERSION" --profile minimal
            export RUSTUP_TOOLCHAIN="$RUST_VERSION"
            export UV_BUILD_CONSTRAINT="$RUNNER_TEMP/maturin.txt"
            printf 'maturin==%s\n' "$MATURIN_VERSION" > "$UV_BUILD_CONSTRAINT"
          fi
          source scripts/ci/private_runtime.sh
          python scripts/ci/py_test_dist.py dist "$VERSION"

  pr-test-windows:
    name: pr-test (windows-x86_64, windows-2025, x86_64-pc-windows-msvc, off)
    if: github.event_name == 'pull_request'
    needs: [validate, pr-test-linux]
    strategy: *windows-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  pr-test-macos-intel:
    name: pr-test (macos-x86_64, macos-15-intel, x86_64-apple-darwin, off)
    if: github.event_name == 'pull_request'
    needs: [validate, pr-test-windows]
    strategy: *macos-intel-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  pr-test-macos-arm64:
    name: pr-test (macos-arm64, macos-15, aarch64-apple-darwin, off)
    if: github.event_name == 'pull_request'
    needs: [validate, pr-test-macos-intel]
    strategy: *macos-arm64-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  pr-test-sdist:
    name: pr-test (sdist, ubuntu-24.04)
    if: github.event_name == 'pull_request'
    needs: [validate, pr-test-macos-arm64]
    strategy: *sdist-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  staging-linux:
    name: staging (linux-x86_64, ubuntu-24.04, x86_64-unknown-linux-gnu, 2_17)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, build-sdist]
    environment: staging
    strategy: *linux-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  staging-windows:
    name: staging (windows-x86_64, windows-2025, x86_64-pc-windows-msvc, off)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, staging-linux]
    environment: staging
    strategy: *windows-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  staging-macos-intel:
    name: staging (macos-x86_64, macos-15-intel, x86_64-apple-darwin, off)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, staging-windows]
    environment: staging
    strategy: *macos-intel-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  staging-macos-arm64:
    name: staging (macos-arm64, macos-15, aarch64-apple-darwin, off)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, staging-macos-intel]
    environment: staging
    strategy: *macos-arm64-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  staging-sdist:
    name: staging (sdist, ubuntu-24.04)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, staging-macos-arm64]
    environment: staging
    strategy: *sdist-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps: *install-tests

  authorize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DELIVERY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      attempt: ${{ steps.check.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN: ${{ inputs.staging_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN" =~ ^[1-9][0-9]*$ ]]
          api="repos/$GITHUB_REPOSITORY"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          run=$(gh api "$api/actions/runs/$STAGING_RUN")
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/publish-python.yml" and .event == "push" and
            .head_repository.full_name == $repo and .head_branch == "main" and
            .head_sha == $sha and .conclusion == "success"' <<<"$run"
          gh api "$api/environments/pypi" | jq -e '
            any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))'
          echo "attempt=$(jq -r .run_attempt <<<"$run")" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DELIVERY_ENABLED == 'true'
    needs: [validate, authorize]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    concurrency: python-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - *checkout
      - *uv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staging_run_id }}
          pattern: py-${{ needs.validate.outputs.version }}-*-${{ needs.authorize.outputs.attempt }}
          path: staged
      - name: Verify all five sealed distributions; exclude manifests from publication
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ATTEMPT: ${{ needs.authorize.outputs.attempt }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir dist
          for id in linux-x86_64 windows-x86_64 macos-x86_64 macos-arm64 sdist; do
            dir="staged/py-$VERSION-$id-$ATTEMPT"
            python scripts/ci/artifacts.py verify "$dir"
            if [[ "$id" == sdist ]]; then
              cp "$dir/taunicorn-$VERSION.tar.gz" dist/
            else
              wheels=("$dir/taunicorn-$VERSION-cp39-abi3-"*.whl)
              test "${#wheels[@]}" -eq 1
              cp "${wheels[0]}" dist/
            fi
          done
          files=(dist/*); test "${#files[@]}" -eq 5
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/*
      - run: uv publish --trusted-publishing always dist/*
