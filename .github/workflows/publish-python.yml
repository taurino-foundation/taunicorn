# SPDX-License-Identifier: MIT OR Apache-2.0
# Build and publish ABI3 wheels for CPython 3.9+.
# WARNING: This workflow PUBLISHES to PyPI on a published GitHub release.
name: Publish Python

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"
  MATURIN_VERSION: "v1.14.1"

jobs:
  validate:
    name: Validate version and ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tag, metadata, and ABI3 feature
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYCODE'
          import os
          import pathlib
          import tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
          member = tomllib.loads(pathlib.Path('crates/taunicorn-python/Cargo.toml').read_text(encoding='utf-8'))
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          version = member['package']['version']
          if isinstance(version, dict) and version.get('workspace'):
              version = root['workspace']['package']['version']
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag.removeprefix('v') != str(version):
              raise SystemExit(f'Release tag {tag!r} does not match version {version!r}')
          if project['project']['requires-python'] != '>=3.9':
              raise SystemExit('Set project.requires-python to >=3.9 in pyproject.toml')
          features = member['dependencies']['pyo3'].get('features', [])
          if 'abi3-py39' not in features:
              raise SystemExit('Enable pyo3 abi3-py39 in crates/taunicorn-python/Cargo.toml')
          print(f'taunicorn {version}: Python >=3.9; abi3-py39 verified')
          PYCODE

  sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: 'false'
      - name: Build sdist
        shell: bash
        run: |
          uv build --sdist
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheels:
    name: ${{ matrix.name }} / cp39-abi3
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            manylinux: '2_17'
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            manylinux: 'off'
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            manylinux: 'off'
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
            manylinux: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: 'false'
      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --manifest-path crates/taunicorn-python/Cargo.toml
            --out dist
      - name: Verify wheel and test all Python test modules
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="$(pwd)/${wheels[0]}"
          case "$(basename "$wheel")" in
            *cp39-abi3*) ;;
            *) echo "Expected cp39-abi3 wheel, got $wheel" >&2; exit 1 ;;
          esac
          for py in 3.9 3.14; do
            echo "Testing $wheel on Python $py"
            if [[ "$py" == "3.9" ]]; then
              pytest_req='pytest>=8.4,<9'
              asyncio_req='pytest-asyncio==1.2.0'
            else
              pytest_req='pytest>=9.1.1,<10'
              asyncio_req='pytest-asyncio>=1.4,<2'
            fi
            uv run --isolated --no-project --python "$py" \
              --with "$wheel" --with "$pytest_req" --with "$asyncio_req" \
              python -m pytest -q --override-ini 'python_files=*.py' python/tests
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check distributions
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 4
          ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
