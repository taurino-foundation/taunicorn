name: Security

on:
  workflow_call:

  schedule:
    - cron: '17 3 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks / full history
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Gitleaks and scan all refs including the checked-out commit
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact=100 --log-opts='--all HEAD --full-history -m' "$GITHUB_WORKSPACE"

  # ============================================================
  # Rust Security Audit
  # ============================================================
  rustsec:
    name: RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: |
          cargo install cargo-audit \
            --version 0.22.2 \
            --locked

      - name: Audit Rust dependencies
        run: cargo audit

  # ============================================================
  # Python Security Audit
  # ============================================================
  python:
    name: Python dependencies / Python 3.9
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.0'
          enable-cache: false

      - name: Export runtime dependencies
        run: |
          uv export \
            --locked --python 3.9.25 \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null

      - name: Audit Python dependencies
        run: |
          uvx --python 3.12.15 \
            --from "pip-audit==2.10.1" \
            pip-audit \
            --require-hashes --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  npm:
    name: JavaScript dependencies / Node 26
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false

      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable --mode=skip-build

      - name: Audit direct and transitive dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs npm audit --all --recursive

      - name: Test detached release inventory and wheel SBOM checks
        run: python3 -B scripts/ci/test_release_sbom.py
