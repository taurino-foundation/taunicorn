name: Security

on:
  pull_request:
    paths: ["crates/**/Cargo.toml", "Cargo.toml", "Cargo.lock", "pyproject.toml", "uv.lock", ".github/workflows/security.yml"]
  push:
    branches: [main]
    paths: ["crates/**/Cargo.toml", "Cargo.toml", "Cargo.lock", "pyproject.toml", "uv.lock", ".github/workflows/security.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit workspace Cargo.lock
        run: cargo audit

  python:
    name: Python dependencies / Python 3.9
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Export runtime dependencies from uv.lock
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --format requirements-txt --output-file requirements-audit.txt
      - name: Audit dependencies
        shell: bash
        run: |
          uvx --from 'pip-audit==2.10.1' pip-audit \
            --requirement requirements-audit.txt
