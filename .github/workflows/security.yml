name: Security

on:
  pull_request:
    paths:
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.18"
  CARGO_AUDIT_VERSION: "0.22.2"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  rustsec:
    name: RustSec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      - name: Audit workspace lockfile
        run: cargo audit

  python:
    name: Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"
      - name: Export runtime dependencies
        run: uv export --no-dev --format requirements-txt --output-file /tmp/requirements.txt
      - name: Audit runtime dependencies
        run: uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --requirement /tmp/requirements.txt