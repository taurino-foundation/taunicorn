name: Publish Rust

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish taunicorn to crates.io after dry-run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-taunicorn
  cancel-in-progress: false

jobs:
  dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify taunicorn package
        run: cargo publish --manifest-path crates/taunicorn/Cargo.toml --locked --dry-run

  publish:
    name: Publish taunicorn
    if: ${{ inputs.publish }}
    needs: dry-run
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish taunicorn
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --manifest-path crates/taunicorn/Cargo.toml --locked
