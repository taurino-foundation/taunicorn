name: Taunicorn quality
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test artifact integrity checks
        run: python3 -m unittest discover -s scripts/ci -p test_artifacts.py -v
      - name: Validate workflow syntax and job dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  actionlint.tgz\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color

  security:
    needs: pipeline
    uses: ./.github/workflows/security.yml

  rust:
    needs: security
    uses: ./.github/workflows/rust-ci.yml

  python:
    needs: rust
    uses: ./.github/workflows/python-ci.yml

  interop:
    needs: python
    name: Python server / Node client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.0'
          enable-cache: false
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs napi build --platform --package taunicorn-javascript --output-dir javascript/taunicorn --js index.cjs -- --locked
      - run: node .yarn/releases/yarn-4.18.1.cjs lint
      - run: node .yarn/releases/yarn-4.18.1.cjs tsc -p __test__/tsconfig.json --noEmit
      - run: node .yarn/releases/yarn-4.18.1.cjs test
      - run: uv run --isolated --locked --python 3.12 python scripts/ci/interop.py
      - run: uv run --isolated --locked --python 3.12 python scripts/ci/test_example_close.py -v
