  # ---------------------------------------------------------------------------
  # Verify minimum Python version
  #
  # ABI3 means one platform is enough to verify the minimum CPython ABI.
  # ---------------------------------------------------------------------------

  compatibility-test:
    name: Python 3.10 ABI compatibility
    needs: wheel-linux-x86_64
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-linux-x86_64
          path: dist

      - name: Test Python 3.10
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"
          test -n "$wheel"

          uv run \
            --isolated \
            --no-project \
            --python 3.10 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

  # ---------------------------------------------------------------------------
  # Publish
  #
  # Active release wheels:
  #   - x86_64-unknown-linux-gnu
  #   - x86_64-pc-windows-msvc
  #   - aarch64-apple-darwin
  #
  # FreeBSD is intentionally excluded until a runner is available.
  # ---------------------------------------------------------------------------

  publish:
    name: Publish to PyPI

    needs:
      - sdist
      - wheel-linux-x86_64
      - wheel-windows-x86_64
      - wheel-macos-arm64
      - compatibility-test

    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    timeout-minutes: 10

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List distributions
        shell: bash
        run: |
          find dist \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Verify release contents
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 3

          test -n "$(find dist -maxdepth 1 -name '*linux*x86_64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*win_amd64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*macosx*arm64*.whl' -print -quit)"

          if find dist -maxdepth 1 -name '*freebsd*.whl' -print -quit | grep -q .; then
            echo "Unexpected FreeBSD wheel in this release" >&2
            exit 1
          fi

          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              *abi3*.whl) ;;
              *)
                echo "Non-ABI3 wheel found: $wheel" >&2
                exit 1
                ;;
            esac
          done

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: dist/*

      - name: Publish
        run: |
          uv publish \
            --trusted-publishing always \
            dist/*
