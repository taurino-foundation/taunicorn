name: Publish Python

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"
  MATURIN_VERSION: "v1.11.5"
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------------------------
  # Validate
  # ---------------------------------------------------------------------------

  validate:
    name: Validate release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --isolated --no-project --python 3.14 python - <<'PY'
          import os
          import pathlib
          import tomllib

          root = tomllib.loads(
              pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          )

          member = tomllib.loads(
              pathlib.Path(
                  "crates/taunicorn-python/Cargo.toml"
              ).read_text(encoding="utf-8")
          )

          version = member["package"]["version"]

          if isinstance(version, dict) and version.get("workspace"):
              version = root["workspace"]["package"]["version"]

          tag = os.environ["RELEASE_TAG"]

          if tag not in {version, f"v{version}"}:
              raise SystemExit(
                  f"release tag {tag!r} does not match "
                  f"taunicorn-python {version!r}"
              )

          print(
              f"{tag!r} matches taunicorn-python {version!r}"
          )
          PY

  # ---------------------------------------------------------------------------
  # Source distribution
  # ---------------------------------------------------------------------------

  sdist:
    name: Source distribution
    needs: validate

    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build source distribution
        shell: bash
        run: |
          printf 'maturin==%s\n' \
            "${MATURIN_VERSION#v}" \
            > /tmp/build-constraints.txt

          uv build \
            --sdist \
            --build-constraint /tmp/build-constraints.txt

      - name: Verify source distribution exists
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Linux
  #
  # Native x86_64 + native ARM64 runners.
  # manylinux 2_17 = broad glibc compatibility.
  # ---------------------------------------------------------------------------

  wheels-linux:
    name: Linux / ${{ matrix.name }}
    needs: validate

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    timeout-minutes: 40

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64

          - name: ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: ${{ matrix.target }}
          manylinux: "2_17"
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path crates/taunicorn-python/Cargo.toml
            --out dist

      - name: Verify ABI3 wheel
        shell: bash
        run: |
          wheel="$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*abi3*.whl' \
            -print \
            -quit)"

          test -n "$wheel"

          echo "Wheel: $wheel"

      - name: Smoke test Python 3.14
        shell: bash
        run: |
          wheel="$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*abi3*.whl' \
            -print \
            -quit)"

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Windows + macOS
  # ---------------------------------------------------------------------------

  wheels-native:
    name: ${{ matrix.name }}
    needs: validate

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    timeout-minutes: 40

    strategy:
      fail-fast: false

      matrix:
        include:
          # Windows x86_64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            python_arch: x64

          # Windows ARM64
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            python_arch: arm64

          # macOS Intel
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            python_arch: x64

          # macOS Apple Silicon
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: ${{ matrix.target }}
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path crates/taunicorn-python/Cargo.toml
            --out dist

      - name: Verify ABI3 wheel
        shell: bash
        run: |
          wheel="$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*abi3*.whl' \
            -print \
            -quit)"

          test -n "$wheel"

          echo "Wheel: $wheel"

      - name: Smoke test
        shell: bash
        run: |
          wheel="$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*abi3*.whl' \
            -print \
            -quit)"

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Verify minimum Python version
  #
  # ABI3 means we do not need to repeat this on every architecture.
  # This verifies that the produced wheel really imports on Python 3.10.
  # ---------------------------------------------------------------------------

  compatibility-test:
    name: Python 3.10 ABI compatibility
    needs: wheels-linux

    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-linux-x86_64
          path: dist

      - name: Test Python 3.10
        shell: bash
        run: |
          wheel="$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*abi3*.whl' \
            -print \
            -quit)"

          test -n "$wheel"

          uv run \
            --isolated \
            --no-project \
            --python 3.10 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

  # ---------------------------------------------------------------------------
  # Publish
  # ---------------------------------------------------------------------------

  publish:
    name: Publish to PyPI

    needs:
      - sdist
      - wheels-linux
      - wheels-native
      - compatibility-test

    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    timeout-minutes: 10

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List distributions
        shell: bash
        run: |
          find dist \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Verify release contents
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

          test -n "$(find dist -maxdepth 1 -name '*linux*x86_64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*linux*aarch64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*win_amd64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*win_arm64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*macosx*x86_64*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*macosx*arm64*.whl' -print -quit)"

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: dist/*

      - name: Publish
        run: |
          uv publish \
            --trusted-publishing always \
            dist/*