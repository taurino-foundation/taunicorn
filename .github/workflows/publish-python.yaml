name: Publish Python

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"
  MATURIN_VERSION: "v1.14.1"
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------------------------
  # Validate
  # ---------------------------------------------------------------------------

  validate:
    name: Validate release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --isolated --no-project --python 3.14 python - <<'PY'
          import os
          import pathlib
          import tomllib

          root = tomllib.loads(
              pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          )

          member = tomllib.loads(
              pathlib.Path(
                  "crates/taunicorn-python/Cargo.toml"
              ).read_text(encoding="utf-8")
          )

          version = member["package"]["version"]

          if isinstance(version, dict) and version.get("workspace"):
              version = root["workspace"]["package"]["version"]

          tag = os.environ["RELEASE_TAG"]

          if tag not in {version, f"v{version}"}:
              raise SystemExit(
                  f"release tag {tag!r} does not match "
                  f"taunicorn-python {version!r}"
              )

          print(
              f"{tag!r} matches taunicorn-python {version!r}"
          )
          PY

  # ---------------------------------------------------------------------------
  # Source distribution
  # ---------------------------------------------------------------------------

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build source distribution
        shell: bash
        run: |
          printf 'maturin==%s\n' \
            "${MATURIN_VERSION#v}" \
            > /tmp/build-constraints.txt

          uv build \
            --sdist \
            --build-constraint /tmp/build-constraints.txt

      - name: Verify source distribution exists
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Linux x86_64
  # Core target: x86_64-unknown-linux-gnu
  # ---------------------------------------------------------------------------

  wheel-linux-x86_64:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: x86_64-unknown-linux-gnu
          manylinux: "2_17"
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path crates/taunicorn-python/Cargo.toml
            --out dist

      - name: Verify ABI3 wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"
          test -n "$wheel"

          case "$(basename "$wheel")" in
            *linux*x86_64*.whl) ;;
            *)
              echo "Unexpected Linux wheel: $wheel" >&2
              exit 1
              ;;
          esac

          echo "Wheel: $wheel"

      - name: Smoke test Python 3.14
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Windows x86_64
  # Core target: x86_64-pc-windows-msvc
  # ---------------------------------------------------------------------------

  wheel-windows-x86_64:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest

    permissions:
      contents: read

    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: x86_64-pc-windows-msvc
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path crates/taunicorn-python/Cargo.toml
            --out dist

      - name: Verify ABI3 wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"
          test -n "$wheel"

          case "$(basename "$wheel")" in
            *win_amd64.whl) ;;
            *)
              echo "Unexpected Windows wheel: $wheel" >&2
              exit 1
              ;;
          esac

          echo "Wheel: $wheel"

      - name: Smoke test Python 3.14
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # macOS ARM64 / Apple Silicon
  # Core target: aarch64-apple-darwin
  # ---------------------------------------------------------------------------

  wheel-macos-arm64:
    name: macOS ARM64
    needs: validate
    runs-on: macos-15

    permissions:
      contents: read

    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          target: aarch64-apple-darwin
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path crates/taunicorn-python/Cargo.toml
            --out dist

      - name: Verify ABI3 wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"
          test -n "$wheel"

          case "$(basename "$wheel")" in
            *macosx*arm64.whl) ;;
            *)
              echo "Unexpected macOS wheel: $wheel" >&2
              exit 1
              ;;
          esac

          echo "Wheel: $wheel"

      - name: Smoke test Python 3.14
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*abi3*.whl' -print -quit)"

          uv run \
            --isolated \
            --no-project \
            --python 3.14 \
            --with "$wheel" \
            --with pytest \
            python -m pytest \
            -q \
            python/tests/test_local_socket_asyncio.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos-arm64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

