name: Rust CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  quality:
    name: Format / Check / Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust nightly for rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Set up Python 3.9 for PyO3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.9.25'

      - name: Format
        run: cargo +nightly fmt --all -- --check

      - name: Check Rust workspace on Python 3.9
        env:
          PYO3_PYTHON: python
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        env:
          PYO3_PYTHON: python
        run: |
          umask 077
          XDG_RUNTIME_DIR=$(mktemp -d "$HOME/.taunicorn-ci.XXXXXXXX")
          export XDG_RUNTIME_DIR
          cargo test --workspace --all-targets --locked

      - name: Clippy Rust workspace
        env:
          PYO3_PYTHON: python
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  transport-tests:
    name: Transport tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows x86_64, os: windows-2025 }
          - { name: macOS Intel, os: macos-15-intel }
          - { name: macOS ARM64, os: macos-15 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Rust transport crate
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != Windows ]]; then
            umask 077
            XDG_RUNTIME_DIR=$(mktemp -d "$HOME/.taunicorn-ci.XXXXXXXX")
            export XDG_RUNTIME_DIR
          fi
          cargo test -p taunicorn --all-targets --locked
          cargo test -p taunicorn --all-targets --locked --features compliance-profile
