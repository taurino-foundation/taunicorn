name: Rust CI

on:
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/rust-ci.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/rust-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format / Check / Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.9 for PyO3
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check Rust transport crate
        run: cargo check --manifest-path crates/taunicorn/Cargo.toml --all-targets --locked
      - name: Check PyO3 crate on Python 3.9
        env:
          PYO3_PYTHON: python
        run: cargo check --manifest-path crates/taunicorn-python/Cargo.toml --all-targets --locked
      - name: Clippy Rust transport crate
        run: cargo clippy --manifest-path crates/taunicorn/Cargo.toml --all-targets --locked -- -D warnings
      - name: Clippy PyO3 crate
        env:
          PYO3_PYTHON: python
        run: cargo clippy --manifest-path crates/taunicorn-python/Cargo.toml --all-targets --locked -- -D warnings

  transport-tests:
    name: Transport tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows x86_64, os: windows-2025 }
          - { name: macOS Intel, os: macos-15-intel }
          - { name: macOS ARM64, os: macos-15 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust transport crate
        run: cargo test --manifest-path crates/taunicorn/Cargo.toml --all-targets --locked
