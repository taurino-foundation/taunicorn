name: Rust CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  quality:
    name: Format / Check / Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust nightly for rustfmt
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --component rustfmt

      - name: Set up Python 3.9 for PyO3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9.25'

      - name: Format
        run: cargo +nightly fmt --all -- --check

      - name: Check Rust workspace on Python 3.9
        env:
          PYO3_PYTHON: python
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        env:
          PYO3_PYTHON: python
        shell: bash
        run: |
          set -euo pipefail

          source scripts/ci/private_runtime.sh

          cargo test \
            --workspace \
            --all-targets \
            --locked

      - name: Clippy Rust workspace
        env:
          PYO3_PYTHON: python
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --locked \
            -- -D warnings

  transport-linux:
    name: Transport tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: quality
    strategy:
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
    steps: &transport-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Test Rust transport crate
        shell: bash
        run: |
          set -euo pipefail

          source scripts/ci/private_runtime.sh

          echo "Running default Rust transport tests"

          cargo test \
            -p taunicorn \
            --all-targets \
            --locked \
            -- --nocapture

          echo "Running compliance-profile transport tests"

          cargo test \
            -p taunicorn \
            --all-targets \
            --locked \
            --features compliance-profile \
            -- --nocapture

  transport-windows:
    name: Transport tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: transport-linux
    strategy:
      matrix:
        include:
          - { name: Windows x86_64, os: windows-2025 }
    steps: *transport-steps

  transport-macos-intel:
    name: Transport tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: transport-windows
    strategy:
      matrix:
        include:
          - { name: macOS Intel, os: macos-15-intel }
    steps: *transport-steps

  transport-macos-arm64:
    name: Transport tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: transport-macos-intel
    strategy:
      matrix:
        include:
          - { name: macOS ARM64, os: macos-15 }
    steps: *transport-steps
