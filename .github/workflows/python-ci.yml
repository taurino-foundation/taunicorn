name: Python CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.18'
          enable-cache: false
      - run: uv lock --check
      - name: Format (existing native stub excluded)
        run: uvx --from ruff==0.11.13 ruff format --check --exclude _taunicorn.pyi python scripts/ci/py_*.py
      - name: Lint package, tests, examples and delivery tests
        run: uvx --from ruff==0.11.13 ruff check python examples/python scripts/ci/py_*.py
      - name: Type-check package and delivery tests (msgpack ships no stubs)
        run: uvx --python 3.12 --from mypy==1.16.1 --with msgpack==1.1.1 --with pytest==8.4.2 mypy --disable-error-code import-untyped --check-untyped-defs python/taunicorn scripts/ci/py_*.py
