name: Feature request
description: Propose a user-visible capability
title: "[Feature]: "
labels:
  - "type:feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need should this feature address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe externally observable behavior rather than an implementation preference.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
